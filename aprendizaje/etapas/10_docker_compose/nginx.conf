# Configuración de nginx dentro del contenedor "web".
# Hace dos trabajos: servir el frontend construido y reenviar /api al backend.
# Es el mismo papel que cumplía el proxy de Vite en el módulo 09.

server {
    listen 80;

    # El frontend: los archivos que generó npm run build.
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Si el archivo no existe, se entrega index.html y React decide qué mostrar.
        try_files $uri $uri/ /index.html;
    }

    # La API. La barra final de proxy_pass quita el prefijo: /api/productos → http://api:8000/productos
    # "api" es el nombre del servicio en compose.yaml: dentro de la red de Compose funciona como dirección.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
