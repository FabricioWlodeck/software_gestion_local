# nginx del frontend: sirve la SPA compilada y reenvía /api al backend (mismo origen, sin CORS).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # /api/productos -> http://backend:8000/productos
    # El nombre "backend" se resuelve con el DNS de Docker en cada petición (no solo al arrancar),
    # así un backend recreado con otra IP no deja la API en 502 hasta reiniciar nginx.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $destino_backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $destino_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Archivos con hash en el nombre: se pueden guardar en caché para siempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca se cachea, así una versión nueva llega al recargar
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Rutas de React Router (/stock, /ventas…): siempre devuelven index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
